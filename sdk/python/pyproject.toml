[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shehuiwenwu"
version = "1.0.0"
description = "社会文物网开放平台 Python SDK —— 文物资质核验、工商核验、信用评分、被盗（丢失）文物比对、材质断代"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["文物", "文物资质", "文物拍卖", "文物商店", "古玩", "收藏", "鉴定", "被盗文物", "信用查询"]
dependencies = []

[project.urls]
Homepage = "https://www.shehuiwenwu.com"
Documentation = "https://github.com/shehuiwenwu/shehuiwenwu-open-sdk"
Repository = "https://github.com/shehuiwenwu/shehuiwenwu-open-sdk"

[tool.setuptools]
packages = ["shehuiwenwu"]
